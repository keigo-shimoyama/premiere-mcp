<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      body {
        font-family: -apple-system, "Segoe UI", sans-serif;
        font-size: 11px;
        margin: 0;
        padding: 10px;
        color: #d8d8d8;
      }
      h1 { font-size: 12px; margin: 0 0 8px; font-weight: 600; }
      #status { padding: 6px 8px; border-radius: 3px; margin-bottom: 8px; font-weight: 600; }
      .up   { background: #1e4620; color: #8fdf95; }
      .down { background: #4a1f1f; color: #ef9a9a; }
      .wait { background: #4a3d1f; color: #e6cf8f; }
      #log {
        font-family: ui-monospace, Menlo, monospace;
        font-size: 10px;
        white-space: pre-wrap;
        word-break: break-word;
        background: #1c1c1c;
        border-radius: 3px;
        padding: 6px;
        height: 260px;
        overflow-y: auto;
      }
      .row { margin-bottom: 3px; }
      .err { color: #ef9a9a; }
      .ok  { color: #8fdf95; }
      .dim { color: #888; }
      button { margin: 0 4px 6px 0; }
    </style>
  </head>
  <body>
    <h1>Premiere MCP Agent</h1>
    <div id="status" class="down">disconnected</div>
    <div>
      <button id="reconnect">Reconnect</button>
      <button id="clear">Clear log</button>
    </div>
    <div id="log"></div>
    <script src="main.js"></script>
  </body>
</html>
